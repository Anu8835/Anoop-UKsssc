<title>Anoop – UKSSSC तैयारी केंद्र</title>

<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mut:#5b6475;--line:#e3dfd3;--pri:#0f6b5c;--pri2:#0a4f44;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef3c7;--chip:#ece8dc;--sh:0 1px 3px rgba(0,0,0,.08)}

*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Nirmala UI","Mukta","Kohinoor Devanagari",system-ui,sans-serif;line-height:1.65}
a{color:var(--pri)}
header.top{background:var(--pri);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:20}
:root[data-theme=dark] header.top{background:#0b3d36}
header.top h1{font-size:1.05rem;margin:0;flex:1;line-height:1.3}
header.top small{display:block;font-weight:400;opacity:.85;font-size:.75rem}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.45rem .9rem;min-height:44px}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme=dark] button.p{color:#06231e}
button.d{color:var(--bad);border-color:var(--bad)}
button.s{min-height:34px;padding:.2rem .7rem;font-size:.85rem}
header.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);min-height:36px;padding:.2rem .6rem}
nav.main{display:flex;gap:.3rem;overflow-x:auto;padding:.4rem .6rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:54px;z-index:19;scrollbar-width:thin}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:.35rem .8rem;border-radius:20px;font-size:.92rem}
nav.main a.on{background:var(--pri);color:#fff}
:root[data-theme=dark] nav.main a.on{color:#06231e}
main{max-width:980px;margin:0 auto;padding:1rem}
h2{margin:.2rem 0 .8rem;font-size:1.35rem}
h3{margin:.6rem 0 .4rem;font-size:1.08rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.9rem;box-shadow:var(--sh)}
.grid{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid2{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}
.stat span{font-size:.82rem;color:var(--mut)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:.88rem}
.chip{display:inline-block;background:var(--chip);border-radius:14px;padding:.05rem .6rem;font-size:.78rem;margin-right:.3rem}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0;padding:.65rem .8rem;border-radius:10px}
.opt.sel{border-color:var(--pri);background:var(--chip)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.expl{background:var(--chip);border-left:4px solid var(--pri);padding:.6rem .8rem;border-radius:8px;margin-top:.6rem}
label.f{display:block;margin:.5rem 0 .2rem;font-size:.9rem;color:var(--mut)}
input,select,textarea{font:inherit;width:100%;padding:.5rem .6rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:42px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{min-height:120px}
.pal{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}
.pal button{min-width:38px;min-height:34px;padding:0}
.pal button.done{background:var(--chip)}.pal button.cur{border-color:var(--pri);border-width:2px}
.tl{border-left:3px solid var(--pri);margin-left:.6rem;padding-left:1rem}
.tl .ev{position:relative;margin-bottom:.8rem}
.tl .ev:before{content:"";position:absolute;left:-1.5rem;top:.5rem;width:12px;height:12px;border-radius:50%;background:var(--pri)}
.tl .ev.unc:before{background:var(--warn)}
details>summary{cursor:pointer;font-weight:600;padding:.3rem 0}
ul.pts{margin:.3rem 0 .2rem 1.1rem;padding:0}
.chips button{min-height:34px;padding:.1rem .7rem;margin:0 .3rem .4rem 0;border-radius:18px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.note{background:var(--warnbg);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:.6rem .8rem;font-size:.9rem;margin:.6rem 0}
.wk{display:flex;align-items:flex-end;gap:.4rem;height:90px}
.wk div{flex:1;text-align:center;font-size:.7rem}
.wk i{display:block;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1rem}
@media(max-width:560px){html{font-size:16px}nav.main{top:50px}}

<script>

(function () {

/* ---------- सहायक ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const safeUrl = u => { try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch (e) { return ''; } };
const LBL = ['क', 'ख', 'ग', 'घ'];
const TOPICS = window.TOPICS, TOPIC_NAME = Object.fromEntries(TOPICS.map(t => [t.id, t.name]));
const DIFF = {easy: 'आसान', medium: 'मध्यम', hard: 'कठिन'};
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : (d || '—'); };

/* ---------- स्टोरेज ---------- */
const LSK = 'ukssc_v1';
const DEFAULTS = () => ({theme: '', goalMin: 60, answers: {}, wrong: {}, bookmarks: [], tests: [], study: {}, studyStart: 0,
  plan: null, topicsDone: [], lastNote: '', content: {qOver: {}, qAdded: [], notes: {}, ca: []},
  feed: {url: '', auto: true, last: 0, msg: '', autoItems: [], feedItems: []}});
let S;
let memOnly = false;
function load() {
  const d = DEFAULTS();
  try {
    const raw = localStorage.getItem(LSK);
    if (raw) { const o = JSON.parse(raw); Object.assign(d, o); d.content = Object.assign(DEFAULTS().content, o.content || {}); d.feed = Object.assign(DEFAULTS().feed, o.feed || {}); }
  } catch (e) { memOnly = true; }
  if (!d.plan) d.plan = window.PLAN_DEFAULT.map(x => ({title: x.title, tasks: x.tasks.map(t => ({t, done: false}))}));
  return d;
}
function save() { try { localStorage.setItem(LSK, JSON.stringify(S)); } catch (e) { memOnly = true; } }
S = load();

/* ---------- प्रभावी डेटा (मूल + एडिटर परिवर्तन) ---------- */
function getQuestions() {
  const o = S.content.qOver, out = [];
  window.QUESTIONS.forEach(q => { if (o[q.id] === null) return; out.push(o[q.id] || q); });
  return out.concat(S.content.qAdded);
}
function getNotes(topic) { return S.content.notes[topic] || window.NOTES[topic] || []; }
function getCA() {
  const all = window.CA_SEED.map(x => Object.assign({kind: 'seed'}, x))
    .concat(S.content.ca.map(x => Object.assign({kind: 'manual'}, x)))
    .concat(S.feed.feedItems.map(x => Object.assign({kind: 'feed'}, x)))
    .concat(S.feed.autoItems.map(x => Object.assign({kind: 'auto'}, x)));
  return all.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
const qById = id => getQuestions().find(q => q.id === id);

/* ---------- थीम ---------- */
function applyTheme() {
  const t = S.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}

/* ---------- अध्ययन-समय ---------- */
function studyToday() { return (S.study[today()] || 0) + (S.studyStart ? Math.floor((Date.now() - S.studyStart) / 1000) : 0); }
function stopStudy() { if (!S.studyStart) return; const sec = Math.floor((Date.now() - S.studyStart) / 1000); S.study[today()] = (S.study[today()] || 0) + sec; S.studyStart = 0; save(); }
const mins = s => Math.floor(s / 60);

/* ---------- उत्तर रिकॉर्ड ---------- */
function recordAnswer(q, correct, fromWrongSection) {
  const a = S.answers[q.id] || {c: 0, w: 0, last: null};
  if (correct) a.c++; else a.w++;
  a.last = correct; S.answers[q.id] = a;
  if (!correct) {
    const w = S.wrong[q.id] || {priority: 0, reviewed: false, topic: q.topic};
    w.priority++; w.reviewed = false; w.topic = q.topic; S.wrong[q.id] = w;
  } else if (fromWrongSection && S.wrong[q.id]) S.wrong[q.id].reviewed = true;
  save();
}

/* ---------- अभ्यास / टेस्ट ---------- */
function buildPool(f) {
  let p = getQuestions();
  if (f.topic !== 'all') p = p.filter(q => q.topic === f.topic);
  if (f.diff !== 'all') p = p.filter(q => q.difficulty === f.diff);
  if (f.source === 'bookmark') p = p.filter(q => S.bookmarks.includes(q.id));
  if (f.source === 'wrong') p = p.filter(q => S.wrong[q.id] && !S.wrong[q.id].reviewed);
  return p;
}
function startQuiz(f) {
  let pool = buildPool(f);
  if (!pool.length) { alert('इन चयनों के लिए कोई प्रश्न उपलब्ध नहीं है। फ़िल्टर बदलें।'); return false; }
  if (f.source === 'wrong') pool.sort((a, b) => S.wrong[b.id].priority - S.wrong[a.id].priority);
  if (f.random) pool = shuffle(pool);
  const n = f.count === 'all' ? pool.length : Math.min(+f.count, pool.length);
  const qs = pool.slice(0, n);
  quiz = {f, qs, i: 0, sel: qs.map(() => null), locked: qs.map(() => false), mode: f.mode, finished: false, start: Date.now(), end: f.mode === 'mock' ? Date.now() + n * 60000 : 0, result: null};
  go('practice');
  return true;
}

function tickTimer() {
  if (!quiz || quiz.finished || quiz.mode !== 'mock') return;
  const left = Math.max(0, Math.ceil((quiz.end - Date.now()) / 1000));
  const el = $('#timer'); if (el) { el.textContent = `⏳ ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`; }
  if (left <= 0) finishQuiz(true);
}
function finishQuiz(timeUp) {
  if (!quiz || quiz.finished) return;
  let correct = 0, wrong = 0, skipped = 0; const wr = [];
  quiz.qs.forEach((q, i) => {
    const s = quiz.sel[i];
    if (s === null) { skipped++; return; }
    const ok = s === q.answer;
    if (quiz.mode === 'mock' || !quiz.locked[i]) recordAnswer(q, ok, quiz.f.source === 'wrong');
    if (ok) correct++; else { wrong++; wr.push(i); }
  });
  const total = quiz.qs.length, pct = Math.round(100 * correct / total);
  quiz.finished = true; quiz.result = {correct, wrong, skipped, total, pct, wr, timeUp: !!timeUp};
  S.tests.push({date: today(), mode: quiz.mode, total, correct, pct, topicName: quiz.f.topic === 'all' ? 'सभी विषय' : TOPIC_NAME[quiz.f.topic]});
  save(); render();
}

async function fetchJSON(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 12000);
  try { const r = await fetch(url, {signal: c.signal, cache: 'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } finally { clearTimeout(t); }
}
const stripHtml = s => String(s || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
async function updateNews() {
  const f = S.feed, msgs = []; let okAny = false;
  if (!navigator.onLine) { f.last = Date.now(); f.msg = 'ऑफ़लाइन — पुराना कैश दिख रहा है।'; save(); return false; }
  if (f.auto) {
    try {
      const rss = 'https://news.google.com/rss/search?q=' + encodeURIComponent('उत्तराखंड when:7d') + '&hl=hi&gl=IN&ceid=IN:hi';
      const j = await fetchJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rss));
      if (j.status !== 'ok' || !Array.isArray(j.items)) throw new Error(j.message || 'फीड त्रुटि');
      f.autoItems = j.items.slice(0, 25).map(it => {
        const t = stripHtml(it.title), k = t.lastIndexOf(' - ');
        return {id: 'auto-' + hash(it.link || t), date: /^\d{4}-\d{2}-\d{2}/.test(it.pubDate || '') ? it.pubDate.slice(0, 10) : today(), title: k > 0 ? t.slice(0, k) : t, summary: '', source: k > 0 ? t.slice(k + 3) : 'Google News', url: safeUrl(it.link), status: 'auto'};
      }).filter(x => x.title);
      msgs.push(f.autoItems.length + ' ऑटो-हेडलाइन'); okAny = true;
    } catch (e) { msgs.push('ऑटो समाचार विफल (' + (e.name === 'AbortError' ? 'समय समाप्त' : e.message) + ')'); }
  } else f.autoItems = [];
  if (f.url) {
    try {
      const j = await fetchJSON(f.url), arr = Array.isArray(j) ? j : j.items;
      if (!Array.isArray(arr)) throw new Error('"items" सूची नहीं मिली');
      f.feedItems = arr.filter(x => x && x.title && x.date).slice(0, 200).map((x, i) => ({id: 'feed-' + hash(x.title + x.date) + i, date: String(x.date).slice(0, 10), title: String(x.title), summary: String(x.summary || ''), source: String(x.source || ''), url: safeUrl(x.url), status: x.status === 'verified' ? 'verified' : 'unverified'}));
      msgs.push(f.feedItems.length + ' प्रविष्टि आपकी फीड से'); okAny = true;
    } catch (e) { msgs.push('आपकी फीड विफल (' + e.message + ')'); }
  } else f.feedItems = [];
  f.last = Date.now(); f.msg = msgs.join(' · ') || 'कोई स्रोत चालू नहीं'; save();
  return okAny;
}

/* ---------- एडिटर ---------- */
function notesToText(arr) { return arr.map(s => '## ' + s.title + '\n' + s.points.map(p => '- ' + p).join('\n')).join('\n\n'); }
function textToNotes(t) {
  const out = []; let cur = null;
  t.split(/\r?\n/).forEach(l => { l = l.trim(); if (!l) return; if (l.startsWith('##')) { cur = {title: l.replace(/^#+\s*/, ''), points: []}; out.push(cur); } else if (cur) cur.points.push(l.replace(/^[-•*]\s*/, '')); });
  return out.filter(s => s.title);
}
function validQ(q) {
  if (!q || typeof q.question !== 'string' || !q.question.trim()) return 'प्रश्न खाली है';
  if (!Array.isArray(q.options) || q.options.length !== 4 || q.options.some(o => typeof o !== 'string' || !o.trim())) return 'ठीक 4 विकल्प चाहिए';
  if (new Set(q.options.map(o => o.trim())).size !== 4) return 'विकल्प अलग-अलग होने चाहिए';
  if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer > 3) return 'सही उत्तर 1–4 के बीच चुनें';
  if (!TOPIC_NAME[q.topic]) return 'विषय अमान्य';
  if (!DIFF[q.difficulty]) return 'कठिनाई अमान्य';
  if (!q.explanation || !String(q.explanation).trim()) return 'व्याख्या जरूरी है';
  return '';
}

    <div class="row" style="margin-top:.5rem"><button class="p" data-act="nSave">💾 सेव</button><button class="d" data-act="nReset">मूल नोट्स बहाल करें</button></div></div>`;
  } else if (adminTab === 'ca') {
    body = `<div class="card"><h3>मैन्युअल करेंट अफेयर जोड़ें</h3><div class="grid2"><div><label class="f">तारीख</label><input type="date" id="cDate" value="${today()}"></div><div><label class="f">स्थिति</label><select id="cStatus"><option value="unverified">असत्यापित</option><option value="verified">सत्यापित (आधिकारिक स्रोत से जांचा)</option></select></div></div>
    <label class="f">शीर्षक</label><input id="cTitle"><label class="f">सार</label><textarea id="cSum" style="min-height:70px"></textarea><label class="f">स्रोत का नाम</label><input id="cSrc"><label class="f">स्रोत का सीधा लिंक (https://…)</label><input id="cUrl">
    <p class="mut" id="cErr" style="color:var(--bad)"></p><button class="p" data-act="cSave">💾 जोड़ें</button></div>
    <div class="card"><h3>आपकी जोड़ी प्रविष्टियां</h3>${S.content.ca.length ? S.content.ca.map(c => `<div class="row sp" style="border-bottom:1px dashed var(--line)"><span>${fmtDate(c.date)} · ${esc(c.title)}</span><button class="s d" data-act="cDel" data-id="${esc(c.id)}">हटाएं</button></div>`).join('') : '<p class="mut">कोई नहीं।</p>'}</div>`;
  } else {
    body = `<div class="card"><h3>कंटेंट (प्रश्न/नोट्स/करेंट अफेयर्स)</h3><div class="row"><button data-act="expContent">⬇️ कंटेंट JSON एक्सपोर्ट</button><label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">⬆️ कंटेंट JSON इंपोर्ट<input type="file" accept=".json,application/json" id="impContent" hidden></label></div><p class="mut">एक्सपोर्ट में आपके जोड़े/बदले गए प्रश्न, नोट्स और करेंट अफेयर्स होते हैं; इंपोर्ट पर वे वर्तमान सामग्री में जुड़/बदल जाते हैं।</p>
    <button data-act="expAllQ">⬇️ सभी प्रश्न JSON (questions.json प्रारूप)</button></div>
    <div class="card"><h3>प्रोग्रेस</h3><div class="row"><button data-act="expProg">⬇️ प्रोग्रेस एक्सपोर्ट</button><label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">⬆️ प्रोग्रेस इंपोर्ट<input type="file" accept=".json,application/json" id="impProg" hidden></label></div></div><p class="mut" id="ioMsg"></p>`;
  }
  return `<h2>🛠️ लोकल कंटेंट एडिटर</h2><div class="note">यह <b>केवल इसी ब्राउज़र में काम करने वाला लोकल एडिटर</b> है — कोई सर्वर, लॉगिन या ऑनलाइन एडमिन नहीं है। बदलाव इसी डिवाइस के LocalStorage में सेव होते हैं; दूसरे डिवाइस पर ले जाने के लिए JSON एक्सपोर्ट/इंपोर्ट करें। (ब्राउज़र डेटा साफ़ करने पर बदलाव मिट सकते हैं — एक्सपोर्ट का बैकअप रखें।)</div>
  <div class="chips">${tabs.map(t => `<button class="${adminTab === t[0] ? 'on' : ''}" data-act="atab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
};
function qListHtml(f) {
  f = f.trim().toLowerCase();
  return getQuestions().filter(q => !f || q.question.toLowerCase().includes(f)).slice(0, 150).map(q => `<div class="row sp" style="border-bottom:1px dashed var(--line);padding:.3rem 0"><span style="flex:1;min-width:200px"><span class="chip">${esc(TOPIC_NAME[q.topic])}</span>${esc(q.question)}</span><span><button class="s" data-act="qEdit" data-id="${esc(q.id)}">✏️</button> <button class="s d" data-act="qDel" data-id="${esc(q.id)}">🗑️</button></span></div>`).join('') || '<p class="mut">कोई प्रश्न नहीं।</p>';
}
function download(name, obj) {
  const b = new Blob([JSON.stringify(obj, null, 1)], {type: 'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function readFile(inp, cb) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { $('#ioMsg').textContent = '❌ अमान्य JSON फ़ाइल: ' + e.message; } }; r.readAsText(f); inp.value = ''; }
function importContent(o) {
  if (!o || typeof o !== 'object') { $('#ioMsg').textContent = '❌ अमान्य संरचना'; return; }
  let n = 0, bad = 0;
  const addQ = q => { if (validQ(q)) { bad++; return; } q.id = q.id || ('c' + Date.now() + n); const bi = window.QUESTIONS.some(x => x.id === q.id); if (bi) S.content.qOver[q.id] = q; else { const i = S.content.qAdded.findIndex(x => x.id === q.id); if (i >= 0) S.content.qAdded[i] = q; else S.content.qAdded.push(q); } n++; };
  const qa = Array.isArray(o) ? o : [].concat(o.qAdded || [], Object.values(o.qOver || {}).filter(Boolean));
  qa.forEach(addQ);
  if (o.notes && typeof o.notes === 'object') Object.keys(o.notes).forEach(k => { if (TOPIC_NAME[k] && Array.isArray(o.notes[k])) S.content.notes[k] = o.notes[k].map(s => ({title: String(s.title), points: (s.points || []).map(String)})); });
  if (Array.isArray(o.ca)) o.ca.forEach(c => { if (c && c.title && c.date && !S.content.ca.some(x => x.id === c.id)) S.content.ca.push({id: c.id || 'm' + Date.now() + Math.random(), date: String(c.date).slice(0, 10), title: String(c.title), summary: String(c.summary || ''), source: String(c.source || ''), url: safeUrl(c.url), status: c.status === 'verified' ? 'verified' : 'unverified'}); });
  save(); render(); const m = $('#ioMsg'); if (m) m.textContent = `✅ ${n} प्रश्न इंपोर्ट हुए${bad ? `, ${bad} अमान्य छोड़े गए` : ''}।`;
}

/* ---------- ईवेंट ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'studyToggle': if (S.studyStart) stopStudy(); else { S.studyStart = Date.now(); save(); } render(); break;
    case 'studyAdd': S.study[today()] = (S.study[today()] || 0) + 600; save(); render(); break;
    case 'taskTog': S.plan[+d.d].tasks[+d.t].done = el.checked; save(); render(); break;
    case 'contRev': go(S.lastNote ? 'notes/' + S.lastNote : 'notes'); break;
    case 'quick10': startQuiz({topic: 'all', diff: 'all', count: '10', mode: 'practice', source: 'all', random: true}); break;
    case 'wrongMock': startQuiz({topic: wrongFilter === 'all' || route[0] !== 'wrong' ? 'all' : wrongFilter, diff: 'all', count: 'all', mode: 'mock', source: 'wrong', random: false}); break;
    case 'reset': if (confirm('क्या आप सच में सारी प्रोग्रेस (उत्तर, गलत प्रश्न, बुकमार्क, टेस्ट, अध्ययन समय, प्लान की स्थिति) रीसेट करना चाहते हैं? यह वापस नहीं होगा।')) { const keep = {content: S.content, feed: S.feed, theme: S.theme, goalMin: S.goalMin}; S = Object.assign(DEFAULTS(), keep); S.plan = window.PLAN_DEFAULT.map(x => ({title: x.title, tasks: x.tasks.map(t => ({t, done: false}))})); quiz = null; dailyDone = false; save(); render(); } break;
    case 'daily': { S.dailyPick = +d.i; dailyDone = true; const q = dailyQuestion(); recordAnswer(q, +d.i === q.answer); render(); break; }
    case 'topicDone': { const i = S.topicsDone.indexOf(d.t); if (i >= 0) S.topicsDone.splice(i, 1); else S.topicsDone.push(d.t); save(); render(); break; }
    case 'topicQuiz': startQuiz({topic: d.t, diff: 'all', count: '10', mode: 'practice', source: 'all', random: true}); break;
    case 'startQuiz': startQuiz(readForm()); break;
    case 'pick': { const i = +d.i; if (quiz.mode === 'mock') quiz.sel[quiz.i] = i; else if (!quiz.locked[quiz.i]) { quiz.sel[quiz.i] = i; quiz.locked[quiz.i] = true; recordAnswer(quiz.qs[quiz.i], i === quiz.qs[quiz.i].answer, quiz.f.source === 'wrong'); } render(); break; }
    case 'jump': quiz.i = +d.i; render(); break;
    case 'next': quiz.i = Math.min(quiz.qs.length - 1, quiz.i + 1); render(); break;
    case 'prev': quiz.i = Math.max(0, quiz.i - 1); render(); break;
    case 'finish': if (quiz.mode === 'mock' && quiz.sel.some(x => x === null) && !confirm('कुछ प्रश्न अनुत्तरित हैं। फिर भी सबमिट करें?')) break; finishQuiz(false); break;
    case 'quit': if (confirm('टेस्ट छोड़ दें? (प्रैक्टिस में हल किए प्रश्न सेव रहेंगे)')) { quiz = null; render(); } break;
    case 'retake': startQuiz(Object.assign({}, quiz.f)); break;
    case 'newTest': quiz = null; render(); break;
    case 'bm': { const i = S.bookmarks.indexOf(d.id); if (i >= 0) S.bookmarks.splice(i, 1); else S.bookmarks.push(d.id); save(); render(); break; }
    case 'wopen': wrongOpen = {id: d.id, done: false, pick: null}; render(); break;
    case 'wpick': { const q = qById(d.id), i = +d.i; recordAnswer(q, i === q.answer, true); wrongOpen = {id: d.id, done: true, pick: i}; render(); break; }
    case 'tlf': tlFilter = d.v; render(); break;
    case 'stype': searchState.type = d.v; render(); { const s = $('#sq'); if (s) s.focus(); } break;
    case 'planEdit': planEdit = !planEdit; render(); break;
    case 'planReset': if (confirm('प्लान डिफ़ॉल्ट पर लौटाएं? (पूर्ण-स्थिति मिट जाएगी)')) { S.plan = window.PLAN_DEFAULT.map(x => ({title: x.title, tasks: x.tasks.map(t => ({t, done: false}))})); save(); render(); } break;
    case 'padd': S.plan[+d.d].tasks.push({t: 'नया कार्य', done: false}); save(); render(); break;
    case 'pdel': S.plan[+d.d].tasks.splice(+d.t, 1); save(); render(); break;
    case 'pdday': if (confirm('यह दिन हटाएं?')) { S.plan.splice(+d.d, 1); save(); render(); } break;
    case 'paddday': S.plan.push({title: 'दिन ' + (S.plan.length + 1) + ': नया', tasks: [{t: 'नया कार्य', done: false}]}); save(); render(); break;
    case 'caf': caFilter = d.v; render(); break;
    case 'fetchNow': { el.disabled = true; el.textContent = '⏳ अपडेट हो रहा है…'; const ok = await updateNews(); render(); const m = $('#feedMsg'); if (m && !ok) m.style.color = 'var(--bad)'; break; }
    case 'feedSave': { const u = $('#feedUrl').value.trim(); if (u && !safeUrl(u)) { alert('कृपया सही http(s) URL डालें।'); break; } S.feed.url = u; S.feed.auto = $('#autoNews').checked; save(); render(); break; }
    case 'atab': adminTab = d.v; editQid = null; render(); break;
    case 'qEdit': editQid = d.id; adminTab = 'mcq'; render(); window.scrollTo(0, 0); break;
    case 'qCancel': editQid = null; render(); break;
    case 'qDel': if (confirm('यह प्रश्न हटाएं?')) { if (window.QUESTIONS.some(x => x.id === d.id)) S.content.qOver[d.id] = null; else S.content.qAdded = S.content.qAdded.filter(x => x.id !== d.id); save(); render(); } break;
    case 'qRestore': if (confirm('सभी संपादन/जोड़े गए प्रश्न हटेंगे और मूल प्रश्न-बैंक बहाल होगा। जारी रखें?')) { S.content.qOver = {}; S.content.qAdded = []; save(); render(); } break;
    case 'qSave': {
      const q = {topic: $('#aTopic').value, difficulty: $('#aDiff').value, question: $('#aQ').value.trim(), options: [0, 1, 2, 3].map(i => $('#aO' + i).value.trim()), answer: +$('#aAns').value, explanation: $('#aExp').value.trim(), source: $('#aSrc').value.trim() || 'लोकल एडिटर', status: 'उपयोगकर्ता-जोड़ा (स्वयं जांचें)'};
      const err = validQ(q); if (err) { $('#aErr').textContent = '❌ ' + err; break; }
      if (editQid) { q.id = editQid; if (window.QUESTIONS.some(x => x.id === editQid)) S.content.qOver[editQid] = q; else { const i = S.content.qAdded.findIndex(x => x.id === editQid); if (i >= 0) S.content.qAdded[i] = q; } } else { q.id = 'c' + Date.now(); S.content.qAdded.push(q); }
      editQid = null; save(); render(); break; }
    case 'nSave': { const tid = $('#nTopic').value, arr = textToNotes($('#nText').value); if (!arr.length) { alert('कम से कम एक "## शीर्षक" ज़रूरी है।'); break; } S.content.notes[tid] = arr; save(); alert('नोट्स सेव हो गए।'); break; }
    case 'nReset': { const tid = $('#nTopic').value; delete S.content.notes[tid]; save(); render(); break; }
    case 'cSave': {
      const c = {id: 'm' + Date.now(), date: $('#cDate').value, title: $('#cTitle').value.trim(), summary: $('#cSum').value.trim(), source: $('#cSrc').value.trim(), url: $('#cUrl').value.trim(), status: $('#cStatus').value};
      if (!c.title || !c.date) { $('#cErr').textContent = '❌ तारीख और शीर्षक ज़रूरी हैं'; break; }
      if (c.url && !safeUrl(c.url)) { $('#cErr').textContent = '❌ लिंक http(s):// से शुरू होना चाहिए'; break; }
      if (c.status === 'verified' && !c.url) { $('#cErr').textContent = '❌ "सत्यापित" के लिए स्रोत का सीधा लिंक ज़रूरी है'; break; }
      c.url = safeUrl(c.url); S.content.ca.push(c); save(); render(); break; }
    case 'cDel': S.content.ca = S.content.ca.filter(x => x.id !== d.id); save(); render(); break;
    case 'expContent': download('ukssc-content.json', S.content); break;
    case 'expAllQ': download('questions.json', getQuestions()); break;
    case 'expProg': download('ukssc-progress.json', {answers: S.answers, wrong: S.wrong, bookmarks: S.bookmarks, tests: S.tests, study: S.study, plan: S.plan, topicsDone: S.topicsDone}); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset && t.dataset.act;
  if (t.id === 'impContent') readFile(t, importContent);
  else if (t.id === 'impProg') readFile(t, o => { if (!o || typeof o !== 'object' || !o.answers) { $('#ioMsg').textContent = '❌ यह प्रोग्रेस फ़ाइल नहीं लगती'; return; } ['answers', 'wrong', 'bookmarks', 'tests', 'study', 'plan', 'topicsDone'].forEach(k => { if (o[k] !== undefined) S[k] = o[k]; }); save(); $('#ioMsg').textContent = '✅ प्रोग्रेस इंपोर्ट हुई।'; });
  else if (t.id === 'wTopic') { wrongFilter = t.value; render(); }
  else if (t.id === 'wRev') { showReviewed = t.checked; render(); }
  else if (t.id === 'stopic') { searchState.topic = t.value; $('#sres').innerHTML = searchResults(); }
  else if (t.id === 'nTopic') { sessionStorage.setItem('nt', t.value); render(); }
  else if (['fTopic', 'fDiff', 'fCount', 'fMode', 'fSource', 'fRandom'].includes(t.id)) updatePool();
  else if (a === 'goalSet') { S.goalMin = Math.max(5, Math.min(600, +t.value || 60)); save(); render(); }
  else if (a === 'ptitle') { S.plan[+t.dataset.d].title = t.value; save(); }
  else if (a === 'ptask') { S.plan[+t.dataset.d].tasks[+t.dataset.t].t = t.value; save(); }
  else if (a === 'autoNews') { /* सेव बटन पर लागू */ }
});
let sTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'sq') { searchState.q = e.target.value; clearTimeout(sTimer); sTimer = setTimeout(() => { const r = $('#sres'); if (r) r.innerHTML = searchResults(); }, 200); }
  else if (e.target.id === 'aSearch') { $('#aList').innerHTML = qListHtml(e.target.value); }
});
$('#themeBtn').addEventListener('click', () => { S.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; save(); applyTheme(); });
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', () => { if (S.studyStart) { /* चलता टाइमर सुरक्षित है (studyStart सेव है) */ } });

/* सेकंड-टिक: टाइमर/अध्ययन-समय */
setInterval(() => {
  tickTimer();
  const el = $('#stT'); if (el) el.textContent = mins(studyToday());
}, 1000);

/* ऑटो-अपडेट: खुलते समय, हर ~6 घंटे */
function autoCheck() {
  if (Date.now() - (S.feed.last || 0) > 6 * 3600 * 1000 && (S.feed.auto || S.feed.url)) updateNews().then(ok => { if (ok && (route[0] === 'ca' || route[0] === 'home')) render(); });
}

/* ---------- शुरुआत ---------- */
applyTheme(); render(); autoCheck();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('online', autoCheck);
})();

</script>
</body>
</html>
